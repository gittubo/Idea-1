<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2304" viewBox="0 0 4096 2304">
  <!--
    THE LAST WITNESS — placeholder study.
    A procedural stand-in for the approved master artwork, so the camera pipeline can be
    built and tested before the master exists. Replace it with the approved master and
    re-frame the keyframes in data/artworks.ts on the new composition.
  -->
  <defs>
    <radialGradient id="wall" cx="0.55" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#2a241d"/>
      <stop offset="0.45" stop-color="#16130f"/>
      <stop offset="1" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="niche" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b241c"/>
      <stop offset="0.25" stop-color="#14110e"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1915"/>
      <stop offset="1" stop-color="#070605"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#ffcf8a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b878" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8b878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#d4c2a2"/>
      <stop offset="0.5" stop-color="#a8977b"/>
      <stop offset="1" stop-color="#6f6352"/>
    </linearGradient>
    <linearGradient id="sideShadow" gradientUnits="userSpaceOnUse" x1="2020" y1="0" x2="2700" y2="200">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.62"/>
      <stop offset="0.82" stop-color="#000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="warmKey" gradientUnits="userSpaceOnUse" cx="2100" cy="700" r="520">
      <stop offset="0" stop-color="#ffdcaa" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffdcaa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="socket" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a2219" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2a2219" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.55" cy="0.48" r="0.72">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="4096" height="2304" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" result="mottle"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="2" seed="3" result="fine"/>
      <feComposite in="mottle" in2="fine" operator="arithmetic" k1="0" k2="0.6" k3="0.55" k4="0" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.38  -0.9 -0.9 -0.9 0 1.55" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="clipped"/>
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="softSmall" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="bustClip">
      <path id="headPath" d="M2095 790 C2090 600 2220 530 2320 535 C2450 540 2520 640 2515 790 C2512 900 2480 990 2420 1050 C2370 1095 2300 1110 2250 1095 C2190 1075 2150 1030 2125 960 C2105 900 2097 850 2095 790 Z"/>
      <path d="M2205 1040 L2405 1030 L2420 1230 L2195 1235 Z"/>
      <path d="M1870 1520 C1860 1400 1930 1300 2060 1255 C2140 1228 2200 1215 2300 1212 C2400 1215 2470 1228 2550 1255 C2680 1300 2745 1400 2735 1520 Z"/>
    </clipPath>
  </defs>

  <!-- chamber -->
  <rect width="4096" height="2304" fill="url(#wall)"/>
  <g opacity="0.75">
    <rect x="860" y="0" width="230" height="1960" fill="#1a1612"/>
    <rect x="860" y="0" width="22" height="1960" fill="#3a3027" opacity="0.6"/>
    <rect x="3420" y="0" width="230" height="1960" fill="#0d0b09"/>
  </g>
  <path d="M1720 1960 L1720 760 A580 580 0 0 1 2880 760 L2880 1960 Z" fill="url(#niche)"/>
  <path d="M1720 1960 L1720 760 A580 580 0 0 1 1990 270" fill="none" stroke="#5a4a38" stroke-width="10" opacity="0.55"/>
  <rect x="0" y="1960" width="4096" height="344" fill="url(#floor)"/>
  <rect x="0" y="1956" width="4096" height="6" fill="#3a3128" opacity="0.5"/>

  <!-- the single warm light -->
  <polygon points="520,0 1260,0 2560,1990 1820,2060" fill="url(#beam)" filter="url(#soft)"/>
  <ellipse cx="2150" cy="2080" rx="720" ry="120" fill="url(#pool)"/>
  <!-- cast shadow, falling away from the light -->
  <polygon points="2600,2010 1990,2020 2900,2240 3700,2200" fill="#000" opacity="0.55" filter="url(#softSmall)"/>

  <!-- pedestal -->
  <g filter="url(#grain)">
    <rect x="1940" y="1960" width="720" height="62" fill="url(#stone)"/>
    <rect x="2010" y="1556" width="580" height="408" fill="url(#stone)"/>
    <rect x="1960" y="1500" width="680" height="60" fill="url(#stone)"/>
  </g>
  <g>
    <rect x="1940" y="1960" width="720" height="62" fill="url(#sideShadow)"/>
    <rect x="2010" y="1556" width="580" height="408" fill="url(#sideShadow)"/>
    <rect x="1960" y="1500" width="680" height="60" fill="url(#sideShadow)"/>
    <rect x="1960" y="1556" width="680" height="14" fill="#000" opacity="0.45"/>
    <rect x="2010" y="1556" width="580" height="40" fill="#000" opacity="0.35" filter="url(#blur3)"/>
  </g>
  <!-- scuffs and handling marks on the pedestal -->
  <g stroke="#e6d6bb" stroke-linecap="round" opacity="0.45">
    <path d="M2030 1512 l38 6" stroke-width="3"/><path d="M2090 1528 l52 -4" stroke-width="2"/>
    <path d="M2160 1510 l26 10" stroke-width="2"/><path d="M2040 1700 l60 4" stroke-width="2"/>
    <path d="M2060 1712 l40 -2" stroke-width="2"/><path d="M2048 1880 l70 -8" stroke-width="3"/>
    <path d="M2120 1898 l30 2" stroke-width="2"/><path d="M1972 1975 l90 0" stroke-width="3"/>
  </g>
  <g stroke="#2a221a" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M2210 1560 l-6 90 l14 70 l-8 60" stroke-width="3"/>
    <path d="M2380 1520 c30 6 60 2 90 10" stroke-width="2"/>
    <ellipse cx="2120" cy="1800" rx="46" ry="20" fill="#1f1913" opacity="0.35" stroke="none"/>
  </g>

  <!-- the bust -->
  <g clip-path="url(#bustClip)">
    <rect x="1800" y="500" width="1000" height="1060" fill="url(#stone)" filter="url(#grain)"/>
    <rect x="1800" y="500" width="1000" height="1060" fill="url(#warmKey)"/>

    <!-- hair, carved -->
    <path d="M2092 800 C2080 610 2220 520 2330 528 C2460 536 2530 640 2518 800 C2500 720 2470 680 2420 650 C2350 610 2250 620 2190 660 C2140 690 2110 740 2092 800 Z" fill="#7d6f5c" opacity="0.55"/>
    <g fill="none" stroke="#3b3128" stroke-linecap="round" opacity="0.55">
      <path d="M2120 720 c20 -40 60 -50 90 -30" stroke-width="5"/>
      <path d="M2180 660 c25 -35 70 -40 100 -15" stroke-width="5"/>
      <path d="M2270 620 c30 -25 75 -20 100 10" stroke-width="5"/>
      <path d="M2370 630 c35 -10 70 10 85 45" stroke-width="5"/>
      <path d="M2440 690 c30 10 50 40 50 80" stroke-width="5"/>
      <path d="M2150 690 c10 -20 30 -28 50 -22" stroke-width="3"/>
      <path d="M2330 580 c20 -10 45 -5 60 12" stroke-width="3"/>
    </g>

    <!-- brow and eyes: blank classical eyes, the left lit, the right falling into shadow -->
    <path d="M2140 760 C2175 735 2235 732 2275 748" fill="none" stroke="#3a3027" stroke-width="10" opacity="0.4" filter="url(#blur3)"/>
    <path d="M2300 750 C2335 738 2375 740 2405 755" fill="none" stroke="#3a3027" stroke-width="10" opacity="0.45" filter="url(#blur3)"/>
    <ellipse cx="2200" cy="800" rx="70" ry="40" fill="url(#socket)"/>
    <ellipse cx="2350" cy="796" rx="58" ry="36" fill="url(#socket)"/>
    <path d="M2155 802 C2180 782 2225 780 2250 800 C2225 816 2180 818 2155 802 Z" fill="#c8b697" opacity="0.8"/>
    <path d="M2155 802 C2180 782 2225 780 2250 800" fill="none" stroke="#2c241c" stroke-width="5" opacity="0.7"/>
    <path d="M2312 798 C2332 782 2370 782 2392 796 C2370 810 2334 812 2312 798 Z" fill="#9d8d73" opacity="0.7"/>
    <path d="M2312 798 C2332 782 2370 782 2392 796" fill="none" stroke="#2c241c" stroke-width="5" opacity="0.7"/>

    <!-- nose, its tip broken away -->
    <path d="M2268 770 C2262 830 2248 880 2232 915 L2262 930 C2280 925 2292 915 2295 905 C2290 860 2285 810 2282 772 Z" fill="#000" opacity="0.32" filter="url(#blur3)"/>
    <path d="M2268 770 C2262 830 2248 880 2228 912" fill="none" stroke="#e6d6b9" stroke-width="6" opacity="0.5"/>
    <path d="M2226 912 L2238 905 L2252 914 L2262 908 L2272 922 L2246 934 Z" fill="#5d5243"/>
    <path d="M2236 940 C2250 948 2272 946 2286 936" fill="none" stroke="#231c15" stroke-width="7" opacity="0.6"/>

    <!-- mouth and chin -->
    <path d="M2190 995 C2220 985 2265 985 2305 992" fill="none" stroke="#2a2219" stroke-width="7" opacity="0.65"/>
    <path d="M2205 1012 C2235 1022 2270 1020 2295 1010" fill="none" stroke="#000" stroke-width="12" opacity="0.18" filter="url(#blur3)"/>
    <ellipse cx="2245" cy="1062" rx="60" ry="22" fill="#000" opacity="0.14" filter="url(#softSmall)"/>
    <ellipse cx="2150" cy="890" rx="55" ry="80" fill="#f2e1c2" opacity="0.18" filter="url(#softSmall)"/>

    <!-- ear, in shadow -->
    <ellipse cx="2468" cy="840" rx="34" ry="72" fill="#4f4538" opacity="0.8"/>
    <path d="M2460 800 c18 18 18 60 2 80" fill="none" stroke="#1e1913" stroke-width="5" opacity="0.7"/>

    <!-- shadow under the jaw onto the neck -->
    <path d="M2190 1060 C2260 1120 2360 1110 2430 1040 L2430 1150 L2190 1150 Z" fill="#000" opacity="0.38" filter="url(#softSmall)"/>
    <!-- drapery folds across the shoulders -->
    <g fill="none" stroke="#3a3027" stroke-linecap="round" opacity="0.5">
      <path d="M1980 1380 C2080 1330 2180 1320 2260 1350" stroke-width="7"/>
      <path d="M1940 1450 C2060 1400 2190 1395 2290 1430" stroke-width="7"/>
      <path d="M2330 1300 C2420 1320 2520 1360 2620 1430" stroke-width="7"/>
      <path d="M2300 1250 C2310 1300 2300 1360 2290 1420" stroke-width="5"/>
    </g>
    <!-- chisel marks -->
    <g stroke="#2c241b" stroke-linecap="round" opacity="0.35">
      <path d="M2010 1290 l18 -10" stroke-width="3"/><path d="M2030 1300 l18 -10" stroke-width="3"/>
      <path d="M2050 1310 l18 -10" stroke-width="3"/><path d="M2070 1318 l18 -10" stroke-width="3"/>
      <path d="M2120 1286 l16 -12" stroke-width="3"/><path d="M2140 1294 l16 -12" stroke-width="3"/>
      <path d="M2160 1302 l16 -12" stroke-width="3"/><path d="M2108 960 l12 -6" stroke-width="2"/>
      <path d="M2116 976 l12 -6" stroke-width="2"/><path d="M2124 992 l12 -6" stroke-width="2"/>
      <path d="M2350 1180 l14 -4" stroke-width="2"/><path d="M2356 1196 l14 -4" stroke-width="2"/>
    </g>
    <!-- cracks: across the cheek, down the neck, through the shoulder -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2122 860 L2150 884 L2146 912 L2172 944 L2168 972 L2196 1010" stroke="#1a140f" stroke-width="4"/>
      <path d="M2124 863 L2152 887 L2148 915 L2174 947" stroke="#e9dabd" stroke-width="1.5" opacity="0.5" transform="translate(-3,-2)"/>
      <path d="M2380 1060 L2372 1110 L2390 1150 L2380 1210" stroke="#140f0b" stroke-width="4"/>
      <path d="M1990 1330 L2030 1352 L2060 1348 L2092 1376 L2140 1384 L2170 1420" stroke="#1a140f" stroke-width="5"/>
      <path d="M2092 1376 L2100 1410 L2090 1450" stroke="#1a140f" stroke-width="3"/>
      <path d="M2196 1010 L2190 1032" stroke="#1a140f" stroke-width="3"/>
    </g>
    <!-- a piece of the shoulder lost -->
    <path d="M2655 1360 L2700 1400 L2735 1470 L2735 1530 L2640 1530 L2650 1470 L2630 1420 Z" fill="#0b0907"/>
    <path d="M2655 1360 L2700 1400 L2735 1470" fill="none" stroke="#8a7a62" stroke-width="3" opacity="0.4"/>

    <!-- one light: everything right of the face surrenders to the dark -->
    <rect x="1800" y="500" width="1000" height="1060" fill="url(#sideShadow)"/>
  </g>

  <rect width="4096" height="2304" fill="url(#vignette)"/>
</svg>
